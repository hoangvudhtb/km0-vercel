<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
/* ===== KM0 — giao diện. Đổi thương hiệu CHỈ ở :root ===== */
:root {
  --brand: #E8590C; --brand-dark: #C2410C; --brand-soft: #FFF1E8; --brand-line: #FFD8BF;
  --ink: #1F2937; --ink-2: #374151; --muted: #6B7280; --faint: #9CA3AF;
  --line: #E5E7EB; --line-2: #F0F1F3; --bg: #F4F5F7; --card: #FFFFFF; --side: #1B1F27; --side-2: #262B35; --side-ink: #C9CED8;
  --ok: #15803D; --ok-bg: #DCFCE7; --warn: #B45309; --warn-bg: #FEF3C7; --bad: #B91C1C; --bad-bg: #FEE2E2; --info: #1D4ED8; --info-bg: #DBEAFE;
  --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08); --shadow-lg: 0 12px 32px rgba(16,24,40,.22);
  --side-w: 262px; --top-h: 56px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5 { margin: 0; line-height: 1.25; }
a { color: var(--brand-dark); text-decoration: none; } a:hover { text-decoration: underline; }
button { font-family: inherit; }
.hide { display: none !important; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; } .xs { font-size: 11.5px; }
.tx-bad { color: var(--bad); } .tx-ok { color: var(--info); } .tx-warn { color: var(--warn); }
.nowrap { white-space: nowrap; } .right { text-align: right; } .center { text-align: center; } .bold { font-weight: 600; }
.mt-1 { margin-top: 6px; } .mt-2 { margin-top: 12px; } .mt-3 { margin-top: 18px; } .mb-1 { margin-bottom: 6px; } .mb-2 { margin-bottom: 12px; } .mb-3 { margin-bottom: 18px; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; } .grow { flex: 1 1 auto; min-width: 0; }
.grid { display: grid; gap: 14px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }

/* ---------- Nút ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, box-shadow .12s; }
.btn:hover { background: #F9FAFB; border-color: #D1D5DB; }
.btn:focus-visible, .inp:focus-visible, .nav-item:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; } .btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; } .btn.ok:hover { filter: brightness(.93); }
.btn.danger { background: #fff; border-color: #FCA5A5; color: var(--bad); } .btn.danger:hover { background: var(--bad-bg); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; } .btn.ghost:hover { background: rgba(0,0,0,.05); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; border-radius: 7px; } .btn.icon { width: 32px; padding: 0; } .btn.sm.icon { width: 28px; }
.btn[disabled], .btn.loading { opacity: .6; pointer-events: none; }
.btn.loading::after { content: ""; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Ô nhập ---------- */
.inp, select.inp, textarea.inp { width: 100%; height: 36px; padding: 0 10px; border: 1px solid #D1D5DB; border-radius: 8px; background: #fff; color: var(--ink); font: inherit; font-size: 14px; transition: border-color .12s, box-shadow .12s; }
textarea.inp { height: auto; min-height: 68px; padding: 8px 10px; resize: vertical; }
.inp:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(232,89,12,.15); outline: none; }
.inp:disabled, .inp[readonly] { background: #F3F4F6; color: #4B5563; }
.inp.sm { height: 30px; font-size: 13px; padding: 0 8px; }
.inp.invalid { border-color: var(--bad); }
label.lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
label.lbl .req { color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.fg { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px 14px; } .fg > .c6 { grid-column: span 6; } .fg > .c12 { grid-column: span 12; } .fg > .c4 { grid-column: span 4; } .fg > .c3 { grid-column: span 3; }
.chk-box { border: 1px solid #D1D5DB; border-radius: 8px; padding: 8px 10px; max-height: 160px; overflow: auto; background: #fff; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 12px; }
.chk-box label { display: flex; gap: 7px; align-items: center; font-size: 13.5px; cursor: pointer; }
.file-w { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .file-w .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.sep { height: 1px; background: var(--line); margin: 14px 0; border: 0; }
/* Khối ảnh gộp (imgGroup) — lưới thumbnail nhỏ gọn thay cho N dòng "Chọn file" */
.img-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.imgw { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--line-2); flex: 0 0 auto; }
.imgw .thumb.sm { width: 100%; height: 100%; object-fit: cover; display: block; }
.imgw.broken .thumb.sm { visibility: hidden; }
.imgw .ov-view, .imgw .ov-x { position: absolute; top: 3px; width: 18px; height: 18px; border-radius: 5px; background: rgba(17,24,39,.62); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10.5px; border: 0; cursor: pointer; text-decoration: none; }
.imgw .ov-view { left: 3px; } .imgw .ov-x { right: 3px; }
.imgw .ov-view:hover, .imgw .ov-x:hover { background: rgba(17,24,39,.85); }
.imgw.add { display: flex; align-items: center; justify-content: center; border: 1px dashed #C7CBD1; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; }
.imgw.add:hover { border-color: var(--ink-2); color: var(--ink-2); }
.imgw.add input { display: none; }

/* ---------- Thẻ, KPI ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card > .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); font-weight: 600; }
.card > .card-b { padding: 14px 16px; } .card > .card-b.flush { padding: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--brand); opacity: .85; }
.kpi.ok::before { background: var(--ok); } .kpi.bad::before { background: var(--bad); } .kpi.info::before { background: var(--info); } .kpi.warn::before { background: #D97706; }
.kpi .k-l { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.kpi .k-v { font-size: 22px; font-weight: 700; margin-top: 3px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .k-s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--brand-line); box-shadow: 0 2px 8px rgba(232,89,12,.15); }

/* ---------- Huy hiệu, chip ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap; background: #F3F4F6; color: #4B5563; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.chip b { font-variant-numeric: tabular-nums; }
.pbar { height: 8px; background: #EEF0F3; border-radius: 99px; overflow: hidden; min-width: 70px; } .pbar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.pbar.ok > i { background: var(--ok); } .pbar.bad > i { background: var(--bad); }

/* ---------- Bảng ---------- */
.tbl-wrap { overflow: auto; max-width: 100%; border-radius: var(--radius); }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tbl th { position: sticky; top: 0; z-index: 1; background: #F9FAFB; text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .025em; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
.tbl th.sortable { cursor: pointer; } .tbl th.sortable:hover { color: var(--ink); } .tbl th .arr { margin-left: 3px; color: var(--brand); }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; max-width: 340px; }
.tbl td.wrap { white-space: normal; min-width: 180px; } .tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tbody tr:hover td { background: #FFFAF6; } .tbl tbody tr.click { cursor: pointer; }
.tbl tfoot td { background: #F9FAFB; font-weight: 700; border-top: 1px solid var(--line); position: sticky; bottom: 0; }
.tbl tr.lock td { color: var(--muted); }
.tbl td .thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); vertical-align: middle; }
.tbl td.acts { text-align: right; white-space: nowrap; width: 1%; }
.tbl .idc { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.empty { padding: 44px 16px; text-align: center; color: var(--muted); } .empty i { font-size: 34px; color: #D1D5DB; display: block; margin-bottom: 8px; }
.skeleton { height: 14px; border-radius: 6px; background: linear-gradient(90deg, #EEF0F3 25%, #F7F8FA 37%, #EEF0F3 63%); background-size: 400% 100%; animation: shimmer 1.3s infinite; margin: 10px 0; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .search { position: relative; flex: 1 1 220px; max-width: 340px; } .toolbar .search i { position: absolute; left: 10px; top: 9px; color: var(--faint); } .toolbar .search .inp { padding-left: 31px; }
.toolbar .fsel { width: auto; min-width: 130px; max-width: 200px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line-2); flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; } .dl .full { grid-column: 1 / -1; }
.dl dt { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 1px; } .dl dd { margin: 0; word-break: break-word; }
.imgs { display: flex; gap: 8px; flex-wrap: wrap; } .imgs img { width: 120px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }

/* ---------- Đăng nhập ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); background: #fff; }
.login-art { background: linear-gradient(155deg, #2B1408 0%, #7C2D0B 45%, var(--brand) 100%); color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login-art::after { content: ""; position: absolute; right: -120px; bottom: -120px; width: 420px; height: 420px; border-radius: 50%; border: 60px solid rgba(255,255,255,.07); }
.login-art::before { content: ""; position: absolute; left: -80px; top: 22%; width: 260px; height: 260px; border-radius: 50%; border: 38px solid rgba(255,255,255,.05); }
.login-art h1 { font-size: 40px; letter-spacing: -.02em; line-height: 1.1; font-weight: 800; } .login-art p { max-width: 430px; color: rgba(255,255,255,.82); font-size: 15.5px; }
.login-art ul { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 10px; color: rgba(255,255,255,.92); position: relative; z-index: 1; } .login-art li i { margin-right: 9px; color: #FFD8BF; }
.login-logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; letter-spacing: .02em; } .logo-mark { width: 40px; height: 40px; border-radius: 11px; background: #fff; color: var(--brand); display: grid; place-items: center; font-weight: 900; font-size: 15px; letter-spacing: -.03em; }
.login-form-wrap { display: flex; align-items: center; justify-content: center; padding: 32px; }
.login-form { width: 100%; max-width: 370px; } .login-form h2 { font-size: 26px; letter-spacing: -.01em; margin-bottom: 4px; }
.login-err { background: var(--bad-bg); color: var(--bad); padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
.pw-w { position: relative; } .pw-w button { position: absolute; right: 4px; top: 3px; }

/* ---------- Khung ứng dụng ---------- */
#app { min-height: 100vh; }
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; z-index: 40; transition: transform .2s; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #2C313C; color: #fff; }
.side-brand .logo-mark { width: 34px; height: 34px; font-size: 13px; border-radius: 9px; } .side-brand b { font-size: 15px; line-height: 1.1; display: block; } .side-brand div span { font-size: 11.5px; color: #9AA1AE; }
.side-search { padding: 10px 12px 6px; } .side-search .inp { background: var(--side-2); border-color: #333947; color: #E5E7EB; height: 32px; font-size: 13px; } .side-search .inp::placeholder { color: #7C8494; }
.side-nav { flex: 1; overflow-y: auto; padding: 4px 8px 16px; scrollbar-width: thin; scrollbar-color: #3A404D transparent; }
.nav-group { margin-top: 6px; } .nav-gh { display: flex; align-items: center; justify-content: space-between; padding: 7px 8px; color: #8E96A5; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; border-radius: 6px; user-select: none; } .nav-gh:hover { color: #C9CED8; }
.nav-gh i { font-size: 10px; transition: transform .15s; } .nav-group.closed .nav-gh i { transform: rotate(-90deg); } .nav-group.closed .nav-items { display: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin: 1px 0; border-radius: 7px; color: var(--side-ink); cursor: pointer; font-size: 13.5px; line-height: 1.3; }
.nav-item i { width: 18px; text-align: center; font-size: 15px; opacity: .85; flex: none; } .nav-item:hover { background: var(--side-2); color: #fff; }
.nav-item.active { background: var(--brand); color: #fff; } .nav-item.active i { opacity: 1; }
.side-user { padding: 10px 12px; border-top: 1px solid #2C313C; display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.side-user .un { min-width: 0; color: #fff; font-size: 13px; line-height: 1.2; } .side-user .un div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .side-user .un span { color: #8E96A5; font-size: 11.5px; }
.main { margin-left: var(--side-w); min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; height: var(--top-h); background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 22px; }
.top h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .top .sub { color: var(--muted); font-size: 12.5px; }
#burger { display: none; }
.content { padding: 20px 22px 60px; max-width: 1500px; width: 100%; }
.bell { position: relative; } .bell .dot { position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.pop { position: absolute; right: 0; top: 40px; width: 360px; max-width: 92vw; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 60; overflow: hidden; }
.pop .ph { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line-2); font-weight: 700; }
.pop .pi { display: block; padding: 10px 14px; border-bottom: 1px solid var(--line-2); font-size: 13px; cursor: pointer; } .pop .pi:hover { background: #FFFAF6; } .pop .pi.unread { background: #FFF7F0; } .pop .pi small { display: block; color: var(--muted); margin-top: 2px; }
.pop .menu-i { display: flex; align-items: center; gap: 9px; padding: 9px 14px; cursor: pointer; font-size: 13.5px; } .pop .menu-i:hover { background: #F9FAFB; }
.banner { display: flex; gap: 10px; align-items: center; background: var(--warn-bg); color: #78350F; border: 1px solid #FCD34D; border-radius: 9px; padding: 9px 14px; margin-bottom: 14px; font-size: 13.5px; }
.overlay-side { display: none; }
#topbar-busy { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--brand); z-index: 200; transition: width .3s; }

/* ---------- Modal, toast ---------- */
.mback { position: fixed; inset: 0; background: rgba(17,24,39,.5); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 14px; overflow-y: auto; animation: fade .12s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 760px; display: flex; flex-direction: column; animation: rise .16s; margin-bottom: 4vh; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal.sm { max-width: 460px; } .modal.lg { max-width: 980px; } .modal.xl { max-width: 1180px; }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line-2); } .modal-h h3 { font-size: 16.5px; font-weight: 700; }
.modal-b { padding: 18px 20px; } .modal-f { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line-2); background: #FAFAFB; border-radius: 0 0 14px 14px; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 300; max-width: min(420px, 92vw); }
.toast { display: flex; gap: 10px; align-items: flex-start; background: #111827; color: #fff; padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 13.5px; animation: rise .16s; }
.toast.error { background: #7F1D1D; } .toast.warn { background: #78350F; } .toast.success { background: #14532D; } .toast i { margin-top: 2px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.86); z-index: 400; display: grid; place-items: center; cursor: zoom-out; } .lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 6px; }

/* ---------- Tab, tiến độ, biểu đồ ---------- */

function saveNavState() { const closed = $$('.nav-group.closed .nav-gh span').map(x => x.textContent); ss('km0_navclosed', JSON.stringify(closed)); }
function drawNav(q) {

  S.menu.forEach(g => {

/* ===== 20_crud: danh sách generic (tìm kiếm, lọc, sắp xếp, phân trang, xuất CSV, in) + chi tiết + luồng duyệt ===== */
const COLLATOR = (function () { try { return new Intl.Collator('vi', { numeric: true, sensitivity: 'base' }); } catch (e) { return { compare: (a, b) => a < b ? -1 : a > b ? 1 : 0 }; } })();

function fieldOf(cfg, key) { return cfg.fields.find(f => f.key === key); }
function tableFields(cfg) { return cfg.fields.filter(f => f.showInTable && f.type !== 'password'); }
function isPctField(f) { return f.type === 'number' && /Pct/.test(f.key); }
function isBadgeField(f) { return (f.type === 'select' && /^(TrangThai|MucDo|TinhTrang)/.test(f.key)) || (f.virtual && f.type === 'text' && /^_(CanhBao|TinhTrangHan|QuaHan)/.test(f.key)) || f.key === 'DaDoc'; }
function isNumeric(f) { return f.type === 'number' || f.type === 'currency'; }

/** Nhãn hiển thị của 1 giá trị (đã tra cứu mã → tên). */
function valueText(f, row) {
  const v = row[f.key];
  if (v === '' || v === null || v === undefined) return '';
  if (f.sourceBy) { const m = f.sourceBy.map[row[f.sourceBy.field]]; return m ? lkLabel(m.source, m.valueField, m.labelField, v) : String(v); }
  if (f.type === 'multiselect') {
    return splitList(v).map(x => { const ex = (f.extraOptions || []).find(e => e[0] === x); if (ex) return ex[1]; return f.source ? lkLabel(f.source, f.valueField, f.labelField, x) : x; }).join(', ');
  }
  if (f.source) return lkLabel(f.source, f.valueField, f.labelField, v);
  if (f.type === 'date') return fmtDate(v);
  if (f.type === 'month') return fmtMonth(v);
  if (f.type === 'currency') return fmtMoney(v);
  if (f.type === 'number') return isPctField(f) ? fmtNum(v, 1) + '%' : (/^(Nam|Thang|Bac|ThuTu)$/.test(f.key) ? String(v) : fmtNum(v));
  return String(v);
}
function fileHTML(url, big) {
  const u = safeUrl(url); if (!u) return esc(url || '');
  if (big) { const th = thumbUrl(u, 480); return '<div class="imgs"><a href="' + esc(u) + '" target="_blank" rel="noopener"><img alt="" loading="lazy" src="' + esc(th) + '" data-zoom="' + esc(thumbUrl(u, 1600)) + '" onerror="this.parentNode.outerHTML=\'<a class=&quot;btn sm&quot; target=_blank rel=noopener href=&quot;' + esc(u) + '&quot;><i class=&quot;bi bi-paperclip&quot;></i> Mở file</a>\'"></a></div>'; }
  return '<a href="' + esc(u) + '" target="_blank" rel="noopener" title="Mở file" onclick="event.stopPropagation()"><i class="bi bi-paperclip"></i> Xem</a>';
}
function cellHTML(f, row) {
  const v = row[f.key];
  if (v === '' || v === null || v === undefined) return '';
  if (f.type === 'file') return fileHTML(v);
  if (isPctField(f)) return pctBar(v);
  if (isBadgeField(f)) return badge(valueText(f, row));
  if (f.type === 'text' && /^Link/.test(f.key) && safeUrl(v)) return '<a href="' + esc(safeUrl(v)) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="bi bi-link-45deg"></i> Mở</a>';
  if (f.type === 'select' && f.key === 'LoaiPhieu') return '<span class="badge ' + (v === 'Thu' ? 'ok' : 'bad') + '">' + esc(v) + '</span>';
  const t = valueText(f, row);
  if ((f.source || f.sourceBy) && t.length > 26) return '<span class="cell-1" title="' + esc(t) + '">' + esc(t) + '</span>'; // round #34: tên tra cứu dài (công trình, vật tư…) 1 dòng
  if (f.type === 'textarea' || t.length > 60) return '<div class="cell-t" title="' + esc(t) + '">' + esc(t) + '</div>';
  return esc(t);
}
function detailHTML(f, row) {
  const v = row[f.key];
  if (v === '' || v === null || v === undefined) return '<span class="faint">—</span>';
  if (f.type === 'file') return fileHTML(v, true);
  if (isPctField(f)) return pctBar(v);
  if (isBadgeField(f)) return badge(valueText(f, row));
  if (f.type === 'text' && /^Link/.test(f.key) && safeUrl(v)) return '<a href="' + esc(safeUrl(v)) + '" target="_blank" rel="noopener">' + esc(v) + '</a>';
  if (f.type === 'textarea') return '<div style="white-space:pre-wrap">' + esc(v) + '</div>';
  return esc(valueText(f, row));
}
function rowSearch(ctx, row) {
  if (row.__s === undefined) row.__s = norm(tableFields(ctx.cfg).map(f => valueText(f, row)).join(' ') + ' ' + row[ctx.cfg.idField]);
  return row.__s;
}
function sortValue(f, row) {
  if (isNumeric(f)) return toNum(row[f.key]);
  if (f.source || f.sourceBy || f.type === 'multiselect') return valueText(f, row);
  return String(row[f.key] === undefined || row[f.key] === null ? '' : row[f.key]);
}
function filterOptions(ctx, f) {
  const seen = {};
  ctx.rows.forEach(r => { const v = r[f.key]; if (v === '' || v === null || v === undefined) return; seen[String(v)] = 1; });
  return Object.keys(seen).map(v => ({ v: v, l: f.source || f.sourceBy ? valueText(f, { [f.key]: v, [(f.sourceBy || {}).field]: null }) || v : (f.type === 'date' ? fmtDate(v) : f.type === 'month' ? fmtMonth(v) : v) })).sort((a, b) => COLLATOR.compare(a.l, b.l));
}
function filteredRows(ctx) {
  const q = norm(ctx.q.trim()), cfg = ctx.cfg, dfield = cfg.dateField;
  let rows = ctx.rows.filter(r => {
    if (q && rowSearch(ctx, r).indexOf(q) < 0) return false;
    for (const k in ctx.flt) { const v = ctx.flt[k]; if (v === '' || v === undefined) continue; const f = fieldOf(cfg, k); if (f && f.type === 'multiselect') { if (splitList(r[k]).indexOf(v) < 0) return false; } else if (String(r[k]) !== String(v)) return false; }
    if (ctx.pre && ctx.pre.values.indexOf(String(r[ctx.pre.field])) < 0) return false;
    if (dfield && (ctx.from || ctx.to)) { const d = String(r[dfield] || '').slice(0, 10); if (ctx.from && d < ctx.from) return false; if (ctx.to && d > ctx.to) return false; }
    return true;
  });
  if (ctx.sort) {
    const f = fieldOf(cfg, ctx.sort.key), dir = ctx.sort.dir === 'desc' ? -1 : 1;
    if (f) rows = rows.map((r, i) => ({ r: r, i: i, v: sortValue(f, r) })).sort((a, b) => { const c = isNumeric(f) ? a.v - b.v : COLLATOR.compare(a.v, b.v); return c ? c * dir : a.i - b.i; }).map(x => x.r);
  }
  return rows;
}

/* ---------- Màn hình danh sách ---------- */
function renderModule(pctx, key, params) {

  const ctx = Object.assign({}, pctx, { key: key, cfg: cfg, rows: [], q: '', flt: Object.assign({}, params.filters || {}), from: params.from || '', to: params.to || '', pre: params.pre || null,
    sort: cfg.defaultSort ? { key: cfg.defaultSort.key, dir: cfg.defaultSort.dir } : null, page: 1, size: 50, hooks: MODULES[key] || {}, openId: params.openId || null });
  ctx.canManage = cfg.manageable !== false && can(key, 'manage');
  ctx.canAdd = cfg.manageable !== false && !cfg.noAdd && (can(key, 'manage') || can(key, 'create'));
  ctx.bulk = cfg.manageable !== false && isAny('Admin'); ctx.sel = {}; // round #25: Admin chọn nhiều dòng -> sửa / xoá hàng loạt
  ctx.reload = () => loadModule(ctx);
  ctx.el.innerHTML = skeleton(8);
  loadModule(ctx);
}
function loadModule(ctx) {
  return api('apiGetModule', ctx.key).then(res => {

/** Danh sách lựa chọn cho select: [[giá trị, nhãn], …] theo nguồn / phụ thuộc / danh sách hệ thống. */
function optionPairs(f, vals) {

    if (f.filterBy) { const pv = vals[f.filterBy], fk = f.filterKey || f.filterBy; if (pv) rows = rows.filter(r => String(r[fk]) === String(pv)); }
    if (f.source === 'nv') rows = rows.filter(r => r.TinhTrang !== 'Nghỉ việc' || String(r[vf]) === String(vals[f.key]));

function parseTable(text) {

    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"' && cur === '') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;

  const act = pts.filter(p => p.actual !== null && p.actual !== undefined), actPath = act.map((p, i) => (i ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.actual).toFixed(1)).join(' ');

  const last = act[act.length - 1], dot = last ? '<circle cx="' + X(last.d) + '" cy="' + Y(last.actual) + '" r="4" fill="#E8590C" stroke="#fff" stroke-width="2"/><text x="' + Math.min(W - R - 2, X(last.d) + 8) + '" y="' + (Y(last.actual) - 8) + '" style="fill:#C2410C;font-weight:700">' + fmtNum(last.actual, 1) + '%</text>' : '';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ S-curve tiến độ">' + g + area + '<path d="' + plan + '" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>' +
    '<path d="' + actPath + '" fill="none" stroke="#E8590C" stroke-width="2.6" stroke-linejoin="round"/>' + today + dot + '</svg>' +
    '<div class="legend mt-1"><span><i style="background:#6B7280"></i>Kế hoạch (luỹ kế)</span><span><i style="background:#E8590C"></i>Thực tế (luỹ kế theo giá trị BOQ)</span><span><i style="background:#1D4ED8"></i>Hôm nay</span></div>';
}

/** Gantt đơn giản: thanh kế hoạch + phần đã hoàn thành. */
function ganttChart(items) {
  items = (items || []).filter(i => i.start && i.end); if (!items.length) return emptyState('Chưa có công việc nào có ngày bắt đầu / kết thúc kế hoạch.', 'bi-bar-chart-steps');
  items = items.slice().sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0).slice(0, 40);
  const W = 900, LW = 230, R = 16, T = 26, RH = 24, H = T + items.length * RH + 8, iw = W - LW - R, t0 = Math.min.apply(null, items.map(i => tsOf(i.start))), t1 = Math.max.apply(null, items.map(i => tsOf(i.end))), span = Math.max(86400000, t1 - t0);
  const X = t => LW + (t - t0) / span * iw; let g = '';
  for (let i = 0; i <= 6; i++) { const t = t0 + span * i / 6, x = LW + iw * i / 6; g += '<line x1="' + x + '" x2="' + x + '" y1="' + (T - 6) + '" y2="' + (H - 6) + '" stroke="#F3F4F6"/><text x="' + x + '" y="14" text-anchor="middle">' + shortMY(new Date(t).toISOString().slice(0, 10)) + '</text>'; }
  items.forEach((it, i) => {
    const y = T + i * RH, x1 = X(tsOf(it.start)), x2 = Math.max(x1 + 3, X(tsOf(it.end) + 86400000)), done = Math.max(0, Math.min(100, it.pct)) / 100 * (x2 - x1), late = it.pct + 1 < it.planPct;
    g += '<text x="' + (LW - 8) + '" y="' + (y + 15) + '" text-anchor="end" style="fill:#374151">' + esc(truncate(it.TenCV, 34)) + '</text><rect x="' + x1 + '" y="' + (y + 4) + '" width="' + (x2 - x1) + '" height="14" rx="4" fill="#E5E7EB"/>' +
      '<rect x="' + x1 + '" y="' + (y + 4) + '" width="' + done + '" height="14" rx="4" fill="' + (late ? '#DC2626' : '#E8590C') + '"/><text x="' + Math.min(W - 24, x2 + 5) + '" y="' + (y + 15) + '" style="fill:#6B7280">' + fmtNum(it.pct, 0) + '%</text>';
  });
  const td = tsOf(todayStr()); if (td >= t0 && td <= t1) g += '<line x1="' + X(td) + '" x2="' + X(td) + '" y1="' + (T - 6) + '" y2="' + (H - 6) + '" stroke="#1D4ED8" stroke-dasharray="4 3"/>';
  return '<div class="tbl-wrap"><svg class="chart" style="min-width:720px" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ Gantt">' + g + '</svg></div><div class="legend mt-1"><span><i style="background:#E8590C"></i>Đã thực hiện</span><span><i style="background:#DC2626"></i>Chậm so với kế hoạch</span><span><i style="background:#E5E7EB"></i>Kế hoạch</span><span><i style="background:#1D4ED8"></i>Hôm nay</span></div>';
}

/** Thanh ngang: rows = [{l, v, sub}] */
function hbars(rows, o) {
  o = o || {}; rows = rows || []; if (!rows.length) return '<div class="muted small">Chưa có dữ liệu</div>';
  const max = Math.max.apply(null, rows.map(r => Math.abs(r.v))) || 1, fmt = o.fmt || (v => fmtNum(v, 0));
  return '<div class="hb-list">' + rows.map((r, i) => '<div class="hb"><div class="hb-l" title="' + esc(r.l) + '">' + esc(truncate(r.l, 30)) + '</div><div class="hb-t"><i style="width:' + (Math.abs(r.v) / max * 100).toFixed(1) + '%;background:' + (o.color || PALETTE[i % PALETTE.length]) + '"></i></div><div class="hb-v">' + esc(fmt(r.v)) + '</div></div>').join('') + '</div>';
}
/** Bánh donut: data = [{k, n}] */
function donut(data, o) {
  o = o || {}; data = (data || []).filter(d => d.n > 0); const tot = data.reduce((s, d) => s + d.n, 0); if (!tot) return '<div class="muted small">Chưa có dữ liệu</div>';
  const R = 15.9155, C = 2 * Math.PI * R; let off = 0, segs = '';
  data.forEach((d, i) => { const len = d.n / tot * 100; segs += '<circle r="' + R + '" cx="21" cy="21" fill="transparent" stroke="' + PALETTE[i % PALETTE.length] + '" stroke-width="6" stroke-dasharray="' + len.toFixed(2) + ' ' + (100 - len).toFixed(2) + '" stroke-dashoffset="' + (25 - off).toFixed(2) + '"/>'; off += len; });
  return '<div class="row" style="gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="130" height="130" role="img" aria-label="' + esc(o.label || 'Biểu đồ tròn') + '"><circle r="' + R + '" cx="21" cy="21" fill="transparent" stroke="#F3F4F6" stroke-width="6"/>' + segs +
    '<text x="21" y="22.5" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#1F2937">' + tot + '</text></svg><div class="grow" style="min-width:150px">' +
    data.map((d, i) => '<div class="row small" style="gap:8px;padding:2px 0"><span style="width:10px;height:10px;border-radius:3px;background:' + PALETTE[i % PALETTE.length] + ';flex:none"></span><span class="grow">' + esc(d.k) + '</span><b>' + d.n + '</b></div>').join('') + '</div></div>';
}
/** Cột đứng: data = [{k, n}] */
function columns(data) {
  data = data || []; if (!data.length) return '<div class="muted small">Chưa có dữ liệu</div>';
  const W = 520, H = 170, L = 26, B = 24, T = 14, max = Math.max.apply(null, data.map(d => d.n)) || 1, bw = (W - L) / data.length;
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ cột">' + data.map((d, i) => { const h = d.n / max * (H - B - T), x = L + i * bw + bw * .18; return '<rect x="' + x.toFixed(1) + '" y="' + (H - B - h).toFixed(1) + '" width="' + (bw * .64).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="#E8590C"/><text x="' + (x + bw * .32).toFixed(1) + '" y="' + (H - B - h - 4).toFixed(1) + '" text-anchor="middle" style="fill:#374151;font-weight:600">' + d.n + '</text><text x="' + (x + bw * .32).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(shortMY(d.k)) + '</text>'; }).join('') + '</svg>';
}

    '<div class="c3"><div class="small muted">Thời tiết sáng</div><div>' + esc(d.thoiTiet.sang || '—') + (d.thoiTiet.muaSang ? ' <span class="badge info">Mưa ' + esc(d.thoiTiet.muaSang) + '</span>' : '') + '</div></div><div class="c3"><div class="small muted">Thời tiết chiều</div><div>' + esc(d.thoiTiet.chieu || '—') + (d.thoiTiet.muaChieu ? ' <span class="badge info">Mưa ' + esc(d.thoiTiet.muaChieu) + '</span>' : '') + '</div></div></div>' +

/** Kế hoạch triển khai ngày mai (mục V báo cáo ngày) — theo 3 nhóm A/B/C như mẫu. */
function khNgayMaiHTML_(rows) {
  if (!rows || !rows.length) return '<h4 class="mt-2">Công tác triển khai ngày mai</h4><div class="muted small">Chưa nhập — thêm ở mục "Kế hoạch triển khai ngày mai" trong form Nhật ký thi công.</div>';
  return '<h4 class="mt-2">Công tác triển khai ngày mai</h4><div class="small">' + ['Công tác hồ sơ', 'Công tác thi công', 'Công tác nghiệm thu xác nhận'].map((l, i) => {
    const list = rows.filter(r => r.Loai === l); if (!list.length) return '';
    return '<div><b>' + 'ABC'.charAt(i) + '. ' + esc(l) + ':</b> ' + list.map(r => esc(r.NoiDung) + (r.ThoiGian ? ' (' + esc(r.ThoiGian) + ')' : '') + (r.CanBoPhuTrach ? ' — ' + esc(r.CanBoPhuTrach.replace(/\n/g, ' ')) : '')).join('; ') + '</div>';
  }).join('') + '</div>';
}
/** Nhắc các ô thông tin công trình in trên báo cáo còn trống (khai báo 1 lần ở mục Công trình). */
function thieuThongTinBC_(info, keys) {
  if (!info) return '';
  const names = { GoiThau: 'Gói thầu', NguoiKyBC: 'Người ký', ChuKyBC: 'Ảnh chữ ký', SoHopDong: 'Hợp đồng số', NhaThauBC: 'Tên nhà thầu', NhaThauVietTat: 'Tên nhà thầu viết tắt', LogoBC: 'Logo', ChuDauTu: 'Chủ đầu tư', DonViTVGS: 'Đơn vị TVGS', VietTat: 'Tên nhà thầu viết tắt' };
  const miss = keys.filter(k => !info[k]);
  return miss.length ? '<div class="badge warn mt-2"><i class="bi bi-info-circle"></i> Còn trống (in ra sẽ để trắng): ' + miss.map(k => esc(names[k] || k)).join(', ') + ' — khai báo 1 lần ở mục "Công trình" (nhóm trường "Báo cáo —").</div>' : '';
}
/** Các bảng phụ khai báo cố định (đối tác liên hệ, thiết bị kiểm định, vật liệu nhập, kế hoạch đệ trình) — dùng chung cho preview ngày + tuần. */
function bangPhuHTML_(d) {
  let out = '';
  if (d.doiTacLienHe && d.doiTacLienHe.length) out += '<h4 class="mt-2">Liên hệ TVGS / CĐT (khai báo)</h4><div class="small">' + d.doiTacLienHe.map(x => esc(x.HoTen) + (x.ChucVu ? ' — ' + esc(x.ChucVu) : '') + (x.DonVi ? ' (' + esc(x.DonVi) + ')' : '')).join(', ') + '</div>';
  if (d.bchNhaThau && d.bchNhaThau.length) out += '<h4 class="mt-2">BCH nhà thầu (khai báo)</h4><div class="small">' + d.bchNhaThau.map(x => esc(x.HoTen) + (x.ChucVu ? ' — ' + esc(x.ChucVu) : '') + (x.NhaThau ? ' (' + esc(x.NhaThau) + ')' : '')).join(', ') + '</div>';
  if (d.thietBiThiCong && d.thietBiThiCong.length) out += '<h4 class="mt-2">Thiết bị thi công — chi tiết kiểm định (khai báo)</h4><div class="small">' + d.thietBiThiCong.map(x => esc(x.TenThietBi) + ' (' + esc(x.NhaThau) + ')' + (x.CanhBao ? ' <span class="badge bad">' + esc(x.CanhBao) + '</span>' : '')).join(', ') + '</div>';
  if (d.thietBiKiemDinh && d.thietBiKiemDinh.length) out += '<h4 class="mt-2">Kiểm định thiết bị (khai báo)</h4><div class="small">' + d.thietBiKiemDinh.map(x => esc(x.TenThietBi) + (x.CanhBao ? ' <span class="badge bad">' + esc(x.CanhBao) + '</span>' : '')).join(', ') + '</div>';
  if (d.vatLieuNhap && d.vatLieuNhap.length) out += '<h4 class="mt-2">Vật liệu nhập về công trường</h4><div class="small">' + d.vatLieuNhap.map(x => esc(x.TenVT) + ': ' + fmtNum(x.kyNay) + ' ' + esc(x.DonVi) + ' (luỹ kế ' + fmtNum(x.luyKe) + ')').join(', ') + '</div>';
  if (d.keHoachDeTrinh && d.keHoachDeTrinh.length) out += '<h4 class="mt-2">Kế hoạch đệ trình hồ sơ (khai báo)</h4><div class="small">' + d.keHoachDeTrinh.map(x => esc(x.NoiDung) + ' — ' + esc(x.TrangThai)).join('<br>') + '</div>';
  return out;
}

/* ---------- Chấm công GPS ---------- */
function getPosition() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Thiết bị / trình duyệt không hỗ trợ định vị.'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), err => rej(new Error(err.code === 1 ? 'Chưa được cấp quyền Vị trí. Hãy cho phép trình duyệt truy cập vị trí của trang này rồi thử lại.' : err.code === 3 ? 'Hết thời gian lấy vị trí GPS. Hãy ra nơi thoáng và thử lại.' : 'Không xác định được vị trí (bật GPS / dịch vụ định vị).')), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

/* ===== 56_nhatky: "Nhật ký thi công" — form gộp 1 nhật ký (nkct) + nhiều dòng công việc/khối lượng con (nktc).
 *  Round #15: trước đây "NK KL thi công" (nktc) và "Nhật ký công trường" (nkct) là 2 màn hình tách rời (nhập công
 *  việc 2 lần). Nay gộp lại: 1 form, phần đầu là nhật ký ngày (dùng lại engine form generic của nkct — buildFieldList/
 *  bindForm/readForm), phần dưới là danh sách công việc có thể thêm/bớt dòng — mỗi dòng hoặc chọn công việc theo BOQ
 *  (gõ để tìm, bắt buộc khối lượng) hoặc nội dung tự do (không khối lượng, VD: san ủi lu lèn nền đường, sửa nền
 *  đường, bơm nước…). Lưu qua apiLuuNhatKyThiCong (ghi header + các dòng ATOMIC trong 1 khoá — xem 04_api.gs). */

/** Hiện/ẩn khung giờ mưa (từ-đến) ngay dưới lựa chọn thời tiết sáng/chiều khi chọn "Mưa nhỏ"/"Mưa lớn". */
function bindWeatherToggle_(root) {
  function wire(selKey, fromKey, toKey) {
    const sel = $('[data-k="' + selKey + '"]', root); if (!sel) return;
    const apply = () => {
      const isMua = /^Mưa/.test(sel.value);
      const fw = $('[data-fk="' + fromKey + '"]', root), tw = $('[data-fk="' + toKey + '"]', root);
      if (fw) fw.classList.toggle('hide', !isMua); if (tw) tw.classList.toggle('hide', !isMua);
    };
    sel.addEventListener('change', apply); apply();
  }
  wire('ThoiTiet', 'MuaTuSang', 'MuaDenSang');
  wire('ThoiTietChieu', 'MuaTuChieu', 'MuaDenChieu');
}

    '</div>' +

    '</div>';
}
/** Gắn sự kiện cho 1 dòng công việc: ô "Nội dung" vừa là ô nhập tự do vừa là ô tìm BOQ (gõ chữ -> gợi ý, bấm chọn
 *  -> khoá vào BOQ đó, hiện Đơn vị + Khối lượng); gõ lại nội dung sau khi đã chọn sẽ HUỶ liên kết BOQ (quay về tự do). */
function bindCvRow_(el, formBox, deletedIds, onAdd) {
  const noidung = $('[data-cv-noidung]', el), ac = $('.ac-list', el), macvct = $('[data-cv-macvct]', el), donvi = $('.cv-donvi', el), kl = $('.cv-kl', el), del = $('[data-cv-del]', el), add = $('[data-cv-add]', el);
  function ctVal() { const w = $('[data-k="MaCT"]', formBox); return w ? w.value : ''; }
  function selectBoq(b) {
    macvct.value = b.MaCVCT; noidung.value = b.TenCV; donvi.textContent = b.DonVi || ''; donvi.classList.remove('hide'); kl.classList.remove('hide'); el.classList.add('boq');
    ac.classList.add('hide'); ac.innerHTML = '';
  }
  function clearBoq() { if (macvct.value) { macvct.value = ''; donvi.classList.add('hide'); kl.classList.add('hide'); el.classList.remove('boq'); } }
  noidung.addEventListener('input', debounce(() => {
    clearBoq();
    const q = norm(noidung.value.trim()), ct = ctVal();
    if (q.length < 2) { ac.classList.add('hide'); ac.innerHTML = ''; return; }
    const rows = (S.lk.bcv || []).filter(b => (!ct || b.MaCT === ct) && norm(b.TenCV + ' ' + (b.NhomCV || '') + ' ' + (b.HangMuc || '') + ' ' + (b.MaHieu || '')).indexOf(q) >= 0).slice(0, 15);
    if (!rows.length) { ac.innerHTML = '<div class="ac-item muted">Không khớp công việc BOQ nào — sẽ lưu như nội dung tự do (không tính khối lượng).</div>'; ac.classList.remove('hide'); return; }
    ac.innerHTML = rows.map((b, i) => '<div class="ac-item" data-i="' + i + '"><b>' + esc(b.TenCV) + '</b> <span class="muted small">' + esc(b.DonVi || '') + (b.NhomCV ? ' · ' + esc(b.NhomCV) : '') + (b.HangMuc ? ' · ' + esc(b.HangMuc) : '') + '</span></div>').join('');
    ac.classList.remove('hide');
    $$('.ac-item[data-i]', ac).forEach(it => it.addEventListener('mousedown', ev => { ev.preventDefault(); selectBoq(rows[+it.getAttribute('data-i')]); }));
  }, 180));
  noidung.addEventListener('blur', () => setTimeout(() => ac.classList.add('hide'), 150));
  add.addEventListener('click', () => onAdd(el));
  del.addEventListener('click', () => { const id = $('[data-cv-id]', el).value; if (id) deletedIds.push(id); el.remove(); });
}

/** Form gộp Thêm/Sửa "Nhật ký thi công" — header (nkct, dùng lại engine form generic) + danh sách công việc con (nktc). */
function openNhatKyThiCongForm(ctx, row, pre) {
  const cfgH = S.cfg.nkct, isNew = !row; pre = pre || {};
  const detailP = isNew ? Promise.resolve(null) : api('apiChiTietNhatKyThiCong', row.MaNKCT);
  Promise.all([ensureLookups(lookupKeysOf(cfgH).concat(['bcv'])), detailP]).then(res => {
    const detail = res[1], header = isNew ? null : detail.header, existingLines = isNew ? (pre.lines || []) : detail.lines;
    // Kế hoạch ngày mai: dòng đã lưu; nhật ký cũ chỉ có ô tự do KeHoachNgayMai -> tách mỗi dòng chữ thành 1 dòng "Công tác thi công" (lưu lại là chuyển sang dạng mới).
    let existingKh = isNew ? [] : (detail.khLines || []);
    if (!isNew && !existingKh.length && header.KeHoachNgayMai) existingKh = String(header.KeHoachNgayMai).split(/\n+/).map(x => x.replace(/^[-•*\s]+/, '').trim()).filter(Boolean).map(x => ({ Loai: 'Công tác thi công', NoiDung: x }));
    const vals = Object.assign({}, isNew ? Object.assign(defaultsOf(cfgH), nhoDefaults_('nkct', cfgH), pre.MaCT ? { MaCT: pre.MaCT } : {}) : header);
    const fields = formFields(cfgH, isNew);
    const headerHTML = '<div class="fg" id="frm-nk" data-entity="nkct">' + buildFieldList(fields, vals, { vals: vals, row: header }) + '</div>';
    const cvHTML = '<hr class="sep"><div class="bold mb-1"><i class="bi bi-list-task"></i> Công việc trong nhật ký <span class="req">*</span></div>' +
      '<p class="hint">Công việc có khối lượng theo BOQ: gõ để tìm & chọn trong danh sách — khối lượng có thể để trống, bổ sung sau khi đo đạc xong (sửa lại ở "Khối lượng thi công" hoặc "Sửa đầy đủ"). Công việc không tính khối lượng (VD: san ủi lu lèn nền đường, sửa nền đường, bơm nước…): gõ nội dung tự do, không chọn gợi ý nào.</p>' +
      '<div id="cv-rows"></div><button type="button" class="btn sm mt-2" id="cv-add"><i class="bi bi-plus-lg"></i>Thêm dòng công việc</button>' +
      '<div id="cm-sec"></div>' +
      '<hr class="sep"><div class="bold mb-1"><i class="bi bi-calendar-event"></i> Kế hoạch triển khai ngày mai</div>' +
      '<p class="hint">In vào mục "V" của Báo cáo ngày (A. Công tác hồ sơ / B. Công tác thi công / C. Công tác nghiệm thu xác nhận) và "Kế hoạch" của Báo cáo tuần. Dòng để trống nội dung sẽ bỏ qua.</p>' +
      '<datalist id="kh-canbo-dl"></datalist><div id="kh-rows"></div><button type="button" class="btn sm mt-2" id="kh-add"><i class="bi bi-plus-lg"></i>Thêm dòng kế hoạch</button>';
    const m = modal({ title: (isNew ? 'Thêm ' : 'Sửa ') + 'nhật ký thi công' + (isNew ? '' : ' · ' + header.MaNKCT), size: 'lg', sticky: true, body: headerHTML + cvHTML,
      buttons: [{ text: 'Huỷ' }, { text: 'Lưu', icon: 'bi-check2', cls: 'primary', id: 'nk-save', fn: (mm, btn) => save(mm, btn) }] });
    const box = $('#frm-nk', m.el); S.uploadKey = 'nkct'; bindForm(box, cfgH, { row: header });
    bindWeatherToggle_(m.el);
    const cvRows = $('#cv-rows', m.el), deletedIds = [];
    function addRow(v, afterEl) {
      const el = document.createElement('div'); el.className = 'cv-row' + (v && v.MaCVCT ? ' boq' : ''); el.innerHTML = cvRowInner_(v);
      if (afterEl && afterEl.nextSibling) cvRows.insertBefore(el, afterEl.nextSibling); else cvRows.appendChild(el);
      bindCvRow_(el, box, deletedIds, rowEl => { const ne = addRow({}, rowEl); const f = $('[data-cv-noidung]', ne); if (f) f.focus(); });
      return el;
    }
    (existingLines.length ? existingLines : [{}]).forEach(v => addRow(v));
    $('#cv-add', m.el).addEventListener('click', () => addRow({}));
    const khRows = $('#kh-rows', m.el), deletedKhIds = [];
    function addKh(v, afterEl) {
      const el = document.createElement('div'); el.className = 'kh-row'; el.innerHTML = khRowInner_(v);
      if (afterEl && afterEl.nextSibling) khRows.insertBefore(el, afterEl.nextSibling); else khRows.appendChild(el);
      $('[data-kh-add]', el).addEventListener('click', () => { const ne = addKh({ Loai: $('[data-kh-loai]', el).value }, el); $('[data-kh-noidung]', ne).focus(); });
      $('[data-kh-del]', el).addEventListener('click', () => { const id = $('[data-kh-id]', el).value; if (id) deletedKhIds.push(id); el.remove(); });
      return el;
    }
    (existingKh.length ? existingKh : [{}]).forEach(v => addKh(v));
    $('#kh-add', m.el).addEventListener('click', () => addKh({}));
    // Gợi ý "Cán bộ phụ trách" từ danh bạ BCH nhà thầu (nhân lực khai báo có họ tên) — không bắt buộc, vẫn gõ tự do được.
    if (typeof nkNhanh_ === 'function') { try { nkNhanh_({ m: m, box: box, isNew: isNew, header: header, addRow: addRow, addKh: addKh, cvRows: cvRows, khRows: khRows, caMay: isNew ? [] : (detail.caMay || []) }); } catch (e) { console.error(e); } }
    ensureLookups(['nlhd']).then(() => { const dl = $('#kh-canbo-dl', m.el); if (dl) dl.innerHTML = (S.lk.nlhd || []).filter(x => x.HoTen).map(x => '<option value="' + esc(x.HoTen + (x.SDT ? '\n' + x.SDT : '')) + '">').join(''); }).catch(() => {});
    function save(mm, btn) {
      const r = readForm(box, fields); if (r.errors.length) return toast(r.errors[0], 'error');
      const headerPayload = Object.assign({}, r.values); if (!isNew) headerPayload[cfgH.idField] = header.MaNKCT;

        const maCVCT = $('[data-cv-macvct]', el).value, klRaw = $('[data-cv-kl]', el).value.trim(), kl = parseNum(klRaw);
        if (maCVCT && klRaw && !(kl > 0)) { err = 'Khối lượng "' + noiDung + '" không hợp lệ.'; return; } // để trống thì bỏ qua, gõ số thì phải hợp lệ (>0)
        const line = { NoiDung: noiDung, MaCVCT: maCVCT, KLThucHien: maCVCT && kl > 0 ? kl : '', DoiThiCong: $('[data-cv-doi]', el).value.trim(), LyTrinh: $('[data-cv-lytrinh]', el).value.trim() };
        const id = $('[data-cv-id]', el).value; if (id) line.MaNKTC = id;

      });

      const khLines = [];
      $$('.kh-row', khRows).forEach(el => {
        const nd = $('[data-kh-noidung]', el).value.trim(); if (!nd) return;
        const k = { Loai: $('[data-kh-loai]', el).value, NoiDung: nd, ThoiGian: $('[data-kh-thoigian]', el).value.trim(), CanBoPhuTrach: $('[data-kh-canbo]', el).value.trim(), GhiChu: $('[data-kh-ghichu]', el).value.trim() };
        const id = $('[data-kh-id]', el).value; if (id) k.MaKHNM = id;
        khLines.push(k);
      });
      if (!lines.length && isNew && !khLines.length && !headerPayload.ThoiTiet && !headerPayload.ThoiTietChieu && !Object.keys(headerPayload).some(k => /^Anh\d+$/.test(k) && headerPayload[k]))
        return toast('Nhật ký đang trống — nhập ít nhất 1 dòng công việc, hoặc thời tiết / hình ảnh / kế hoạch ngày mai.', 'error');
      const cm = typeof nkCaMayLines_ === 'function' ? nkCaMayLines_(m) : null;
      if (cm && cm.err) return toast(cm.err, 'error');
      withBusy(btn, () => api('apiLuuNhatKyThiCong', headerPayload, lines, deletedIds, khLines, deletedKhIds, cm ? cm.lines : undefined, cm ? cm.deleted : undefined)).then(res2 => {
        toast(isNew ? 'Đã thêm nhật ký thi công' + (cm && cm.lines.length ? ' kèm ' + cm.lines.length + ' dòng ca máy' : '') + '.' : 'Đã lưu thay đổi.', 'success'); warnAll(res2.warn);
        if (cm && cm.boQua) toast('Bỏ qua ' + cm.boQua + ' dòng máy chưa nhập số ca.', 'warn', 6000);
        if (isNew) nhoGhi_('nkct', cfgH, headerPayload);
        dropLookup('nkct'); dropLookup('nktc'); dropLookup('nkm'); mm.close(); ctx.reload();
      }).catch(fail);
    }
  }).catch(fail);
}

/* ===== 57_kehoachtuan: "Kế hoạch thi công tuần tới" — khung KL thực hiện + kế hoạch GIỐNG HỆT báo cáo tuần (mục III.3 + III.4).
 *  Chọn KỲ BÁO CÁO (tuần này, cùng kỳ với Báo cáo tuần) -> hệ thống tự tính sẵn cho từng công việc BOQ: Ngày bắt đầu /
 *  Kết thúc kế hoạch, KL thi công tuần này (%), LK đến thời điểm hiện tại (%) — công việc tuần này không có khối lượng
 *  vẫn hiện luỹ kế, không để trống — và Đánh giá. Người dùng chỉ nhập cột "KL thi công tuần tới" (% KL hợp đồng) cho
 *  tuần kế tiếp (den+1 → den+7). Lưu qua apiKeHoachTuanLuu (entity khtt); Báo cáo tuần in đúng số đã nhập. */
function romanKT_(n) { const t = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; t.forEach(p => { while (n >= p[0]) { s += p[1]; n -= p[0]; } }); return s; }
function ktPct_(v) { const r = Math.round((v || 0) * 10) / 10; return fmtNum(r) + '%'; }
function ktRowsHTML_(d, canEdit) {
  let html = '';
  const dg = v => '<span class="' + (v === 'Chậm tiến độ' ? 'tx-bad' : v === 'Đạt tiến độ' ? 'tx-ok' : v === 'Nguy cơ chậm' ? 'tx-warn' : '') + '">' + esc(v || '') + '</span>';
  const inp = it => {
    const sv = d.saved[it.MaCVCT], goiY = Math.round((it.pctTuanToi || 0) * 10) / 10;
    const kl = it.DonVi !== '%' && it.KLThietKe > 0 ? '<div class="xs muted kt-kl" data-kl="' + it.KLThietKe + '" data-dv="' + esc(it.DonVi) + '"></div>' : '';
    return '<td class="num" style="min-width:118px"><input class="inp sm num kt-in" data-id="' + esc(it.MaCVCT) + '" data-goiy="' + goiY + '" inputmode="decimal" aria-label="% kế hoạch tuần tới: ' + esc(it.ten) + '"' +
      ' placeholder="gợi ý ' + fmtNum(goiY) + '" value="' + (sv ? esc(fmtNum(sv.PctKH)) : '') + '"' + (canEdit ? '' : ' disabled') + ' style="width:78px;text-align:right"> %' + kl + '</td>';
  };
  // KL tuần này = 0 -> vẫn in "0%" và luỹ kế thật (không để trống), đúng như báo cáo tuần
  const itemRow = (stt, it, bold) => '<tr' + (bold ? ' class="bold"' : '') + '><td class="center">' + esc(stt) + '</td><td>' + esc(it.ten) + '</td>' +
    '<td class="center nowrap">' + esc(fmtDate(it.st)) + '</td><td class="center nowrap">' + esc(fmtDate(it.en)) + '</td>' +
    '<td class="num">' + ktPct_(it.pctKy) + (it.DonVi !== '%' && it.kyNay ? '<div class="xs muted">' + fmtNum(it.kyNay) + ' ' + esc(it.DonVi) + '</div>' : '') + '</td>' +
    '<td class="num">' + ktPct_(it.pct) + (it.DonVi !== '%' && it.luyKe ? '<div class="xs muted">' + fmtNum(it.luyKe) + ' ' + esc(it.DonVi) + '</div>' : '') + '</td>' +
    inp(it) + '<td>' + dg(it.danhGia) + '</td></tr>';
  const headRow = (stt, ten) => '<tr class="bold" style="background:var(--line-2)"><td class="center">' + esc(stt) + '</td><td colspan="7">' + esc(ten) + '</td></tr>';
  d.tree.forEach((hm, hi) => {
    if (hm.don) { html += itemRow(romanKT_(hi + 1), hm.don, true); return; }
    html += headRow(romanKT_(hi + 1), hm.ten);
    let gi = 0, ii = 0;
    hm.nodes.forEach(nd => {
      if (nd.type === 'grp') { gi++; html += headRow(String(gi), nd.ten); nd.items.forEach((it, k) => { html += itemRow(String(k + 1), it); }); }
      else html += itemRow(String(++ii), nd.item);
    });
  });
  return html || '<tr><td colspan="8">' + emptyState('Công trình chưa có công việc BOQ') + '</td></tr>';
}

/* ===== 58_hoso: round #23 — Nhập BOQ từ file dự thầu / phụ lục HĐ; Tiến độ theo trình tự thi công (Gantt); Nhật ký thi công mẫu NĐ 06;
 * Danh mục hồ sơ hoàn thành công trình; nút xuất Word / lập hàng loạt Biên bản nghiệm thu. ===== */

/* ---------- Đọc file Excel ngay trên trình duyệt ---------- */
/** .xlsx: tự giải nén (DecompressionStream) + đọc XML — không cần mạng. .xls (Excel 97-2003) / trình duyệt cũ: nạp SheetJS từ cdnjs. */
function docFileExcel_(file, maxCol) {
  maxCol = maxCol || 40;
  const ten = String(file.name || '').toLowerCase();
  return file.arrayBuffer().then(buf => {
    const u8 = new Uint8Array(buf);
    if (/\.(csv|txt)$/.test(ten)) return [{ name: file.name.replace(/\.[^.]+$/, ''), rows: parseTable(new TextDecoder('utf-8').decode(u8)) }];
    if (u8[0] === 0x50 && u8[1] === 0x4B && typeof DecompressionStream !== 'undefined') return docXlsx_(buf, maxCol).catch(() => docBangSheetJS_(u8, maxCol));
    return docBangSheetJS_(u8, maxCol);
  });
}
function docXlsx_(buf, maxCol) {
  maxCol = maxCol || 40;
  const u8 = new Uint8Array(buf), dv = new DataView(buf), td = new TextDecoder('utf-8');
  let e = -1; for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) return Promise.reject(new Error('File không đúng định dạng .xlsx.'));
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const ent = {};
  for (let k = 0; k < n && p + 46 <= u8.length; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    ent[td.decode(u8.subarray(p + 46, p + 46 + nl)).replace(/^\//, '')] = { method: method, csize: csize, off: off };
    p += 46 + nl + xl + cl;
  }
  const doc = name => {
    const x = ent[name]; if (!x) return Promise.resolve(null);
    const st = x.off + 30 + dv.getUint16(x.off + 26, true) + dv.getUint16(x.off + 28, true), data = u8.slice(st, st + x.csize);
    const txt = x.method === 0 ? Promise.resolve(td.decode(data)) : new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(b => td.decode(b));
    return txt.then(t => new DOMParser().parseFromString(t, 'application/xml'));
  };
  const tags = (d, t) => d ? Array.prototype.slice.call(d.getElementsByTagNameNS('*', t)) : [];
  const text = el => tags(el, 't').map(t => t.textContent).join('');
  return Promise.all([doc('xl/workbook.xml'), doc('xl/_rels/workbook.xml.rels'), doc('xl/sharedStrings.xml')]).then(r => {
    const wbx = r[0]; if (!wbx) throw new Error('Không đọc được workbook.');
    const rel = {}; tags(r[1], 'Relationship').forEach(x => { rel[x.getAttribute('Id')] = x.getAttribute('Target'); });
    const sst = tags(r[2], 'si').map(text);
    const sheets = tags(wbx, 'sheet').filter(s => s.getAttribute('state') !== 'hidden' && s.getAttribute('state') !== 'veryHidden').map(s => {
      const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let t = rel[rid] || ''; t = t.charAt(0) === '/' ? t.slice(1) : 'xl/' + t.replace(/^\.\//, '');
      return { name: s.getAttribute('name'), path: t };
    });
    return Promise.all(sheets.map(s => doc(s.path).then(d => {
      const rows = [], fcells = []; // round #35: ô có công thức (để tải lên lại phân biệt ô gõ tay với ô tự tính)
      tags(d, 'row').slice(0, 6000).forEach(rw => {
        const ri = Number(rw.getAttribute('r')) - 1; if (!(ri >= 0) || ri >= 6000) return;
        const row = rows[ri] = [];
        tags(rw, 'c').forEach(c => {
          const ref = c.getAttribute('r') || '', m = ref.match(/^([A-Z]+)/); if (!m) return;
          let ci = 0; for (let i = 0; i < m[1].length; i++) ci = ci * 26 + m[1].charCodeAt(i) - 64; ci--;
          if (ci >= maxCol) return;
          const t = c.getAttribute('t'), v = tags(c, 'v')[0]; if (tags(c, 'f').length && fcells.length < 30000) fcells.push([ri, ci]);
          let val = '';
          if (t === 's') val = v ? (sst[Number(v.textContent)] || '') : '';
          else if (t === 'inlineStr') val = text(tags(c, 'is')[0]);
          else if (t === 'str' || t === 'e') val = v ? v.textContent : '';
          else if (t === 'b') val = v ? (v.textContent === '1' ? 'TRUE' : 'FALSE') : '';
          else if (v) { const num = Number(v.textContent); val = isNaN(num) ? v.textContent : num; }
          row[ci] = val;
        });
      });
      const out = []; for (let i = 0; i < rows.length; i++) { const rr = rows[i] || []; const o = []; for (let j = 0; j < rr.length; j++) o.push(rr[j] === undefined ? '' : rr[j]); out.push(o); }
      return { name: s.name, rows: out, f: fcells };
    })));
  });
}
function taiSheetJS_() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => window.XLSX ? ok(window.XLSX) : bad(new Error('Không nạp được bộ đọc file Excel.'));
    s.onerror = () => bad(new Error('Không nạp được bộ đọc file .xls (cần mạng Internet). Mở file bằng Excel → File → Save As → "Excel Workbook (*.xlsx)" rồi chọn lại.'));
    document.head.appendChild(s);
  });
}
function docBangSheetJS_(u8, maxCol) {
  maxCol = maxCol || 40;
  return taiSheetJS_().then(X => {
    const wb = X.read(u8, { type: 'array' });
    return wb.SheetNames.map(n => ({ name: n, rows: X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }).slice(0, 6000).map(r => r.slice(0, maxCol)) }));
  });
}

          $$('[data-del]', el).forEach(c => c.addEventListener('click', () => { rows.splice(+c.getAttribute('data-del'), 1); veB(el); }));

      }).catch(fail);
    }

} };

/* ===== 61_nhapnhanh: round #29 — ĐỢT 1 nhập liệu nhanh =====
 * E3 ô số nhận biểu thức (12*6*0,3) · E4 Ctrl+S = nút chính của hộp thoại · A4 đọc chính tả (micro) · A5 mẫu câu + câu hay dùng

/* ---------------- E3. Biểu thức trong ô số ---------------- */
/** "12*6*0,3" -> 21.6 ; "(5+3)x2" -> 16 ; "10:4" -> 2.5. Không phải biểu thức -> null. */
function evalBieuThuc_(raw) {
  let s = String(raw === null || raw === undefined ? '' : raw).trim();
  if (!s) return null;
  s = s.replace(/[x×X]/g, '*').replace(/÷|:/g, '/').replace(/\s+/g, '');
  if (!/[+*/()]|\d-/.test(s)) return null;
  if (!/^[\d.,+\-*/()]+$/.test(s)) return null;
  const toks = []; let i = 0;
  while (i < s.length) {
    if (/\d/.test(s[i])) { let j = i; while (j < s.length && /[\d.,]/.test(s[j])) j++; const n = parseNum(s.slice(i, j)); if (typeof n !== 'number' || isNaN(n)) return null; toks.push(n); i = j; }
    else toks.push(s[i++]);
  }
  let p = 0;
  function expr() { let v = term(); while (toks[p] === '+' || toks[p] === '-') { const op = toks[p++], r = term(); v = op === '+' ? v + r : v - r; } return v; }
  function term() { let v = fac(); while (toks[p] === '*' || toks[p] === '/') { const op = toks[p++], r = fac(); v = op === '*' ? v * r : v / r; } return v; }
  function fac() { const t = toks[p]; if (t === '-') { p++; return -fac(); } if (t === '+') { p++; return fac(); } if (t === '(') { p++; const v = expr(); if (toks[p++] !== ')') throw new Error('('); return v; } if (typeof t === 'number') { p++; return t; } throw new Error('?'); }
  try { const v = expr(); if (p !== toks.length || !isFinite(v)) return null; return Math.round(v * 1e6) / 1e6; } catch (e) { return null; }
}
function nnSoO_(el) { return el && el.tagName === 'INPUT' && (el.getAttribute('inputmode') === 'decimal' || el.getAttribute('data-t') === 'currency' || el.classList.contains('nn-num')); }

function nnTinhO_(el) {
  if (!nnSoO_(el)) return false;
  const raw = el.value, v = evalBieuThuc_(raw); if (v === null) return false;
  el.value = el.getAttribute('data-t') === 'currency' ? fmtMoney(Math.round(v)) : String(v).replace('.', ',');
  el.title = 'Biểu thức: ' + raw + ' = ' + fmtNum(v, 4); el.classList.add('nn-calc'); setTimeout(() => el.classList.remove('nn-calc'), 900);
  el.dispatchEvent(new Event('input', { bubbles: true }));

}

  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && String(e.key).toLowerCase() === 's') {

/* ---------------- A4 + A5: micro đọc chính tả + mẫu câu / câu hay dùng dưới ô ghi chú ---------------- */

/* ---------------- E5. Kiểm tra tức thời trong form chung ---------------- */
function nnBindForm_(box, cfg, o) {
  nnTangCuong_(box);
  const key = box.getAttribute('data-entity'); if (!key || !S.cfg[key]) return;
  const v = k => { const el = $('[data-k="' + k + '"]', box); return el ? el.value : ''; };
  const dateKey = cfg.dateField || (cfg.fields.some(f => f.key === 'Ngay' && f.type === 'date') ? 'Ngay' : '');
  const hasCT = cfg.fields.some(f => f.key === 'MaCT');

  const cache = {}, row = o.row || {};
  function lay(rec) { const k = JSON.stringify(rec); if (cache[k]) return Promise.resolve(cache[k]); return api('apiKiemTraNhanh', key, rec).then(r => { cache[k] = r; return r; }); }

    const ct = v('MaCT'); if (!ct) { out.classList.add('hide'); return; }
    const rec = { MaCT: ct }; if (key === 'kho') { rec.MaVT = v('MaVT'); rec.MaNK = row.MaNK || ''; } if (key === 'nktc' || key === 'nkm') { rec.MaCVCT = v('MaCVCT'); rec.MaNKTC = row.MaNKTC || ''; }

        if (r.ct.NgayHoanThanh && ngay > r.ct.NgayHoanThanh) msg.push(['warn', 'Ngày ' + fmtDate(ngay) + ' sau ngày hoàn thành dự kiến (' + fmtDate(r.ct.NgayHoanThanh) + ').']);
        if (ngay > todayStr() && /^(nktc|nkm|kho|nkct|cc)$/.test(key)) msg.push(['warn', 'Ngày ở tương lai.']);

      if (key === 'kho' && r.ton !== undefined) {
        const kl = parseNum(v('KhoiLuong')), xuat = v('Loai') === 'Xuất';

        else msg.push(['info', 'Tồn kho hiện tại: ' + fmtNum(r.ton) + ' ' + (r.dv || '') + (xuat && kl > 0 ? ' → còn ' + fmtNum(r.ton - kl) : '')]);
      }

        else msg.push(['info', 'Lũy kế sau lần này: ' + fmtNum(sau) + ' / ' + fmtNum(b.tk) + ' ' + b.dv + ' (' + fmtNum(pct, 1) + '%) · còn ' + fmtNum(b.tk - sau)]);
        if (ngay && b.bd && ngay < b.bd) msg.push(['warn', 'Chưa tới ngày bắt đầu kế hoạch của công việc (' + fmtDate(b.bd) + ').']);
      }
      out.innerHTML = msg.map(m => '<div class="nn-msg ' + m[0] + '"><i class="bi ' + (m[0] === 'info' ? 'bi-info-circle' : 'bi-exclamation-triangle') + '"></i>' + esc(m[1]) + '</div>').join('');

    }).catch(() => out.classList.add('hide'));
  }, 350);

}

/** Tách dòng dán: tên + KL (số cuối dòng, nhận biểu thức) + khớp BOQ (mã hiệu -> tên chứa -> độ giống theo từ). */
function nkPhanTichDan_(text, bcv) {
  const tu = s => norm(s).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(w => w.length > 1);
  const bT = bcv.map(b => ({ b: b, w: tu(b.TenCV), ma: norm(b.MaHieu || '').replace(/\s/g, '') }));
  return String(text || '').replace(/\r/g, '').split('\n').map(x => x.trim()).filter(Boolean).map(goc => {
    let ten = goc, kl = '';
    const cells = goc.split('\t').map(x => x.trim()).filter(Boolean);
    if (cells.length > 1) { const last = cells[cells.length - 1], v = evalBieuThuc_(last) !== null ? evalBieuThuc_(last) : parseNum(last.replace(/[a-zA-Z²³]+\d*$/, '').trim()); if (typeof v === 'number' && !isNaN(v)) { kl = v; ten = cells.slice(0, -1).filter(c => isNaN(parseNum(c))).join(' '); } }
    if (kl === '') {
      const mm = goc.match(/^(.*?)[\s:=]+([\d.,+\-*/x×()]+)\s*(m3|m2|md|m|km|tấn|tan|kg|cái|cai|bộ|bo|ca|100m3|100m2|cây|cay|hố|ho|cọc|coc)?\s*$/i);
      if (mm) { const v = evalBieuThuc_(mm[2]) !== null ? evalBieuThuc_(mm[2]) : parseNum(mm[2]); if (typeof v === 'number' && !isNaN(v)) { kl = v; ten = mm[1].replace(/^[-•*+\d.)\s]+(?=\D)/, '').trim(); } }
    }
    ten = ten.replace(/[:=\-–]+$/, '').trim() || goc;
    const nt = norm(ten).replace(/\s/g, ''), w = tu(ten);
    let best = null, diem = 0;
    bT.forEach(x => {
      let d = 0;
      if (x.ma && nt.indexOf(x.ma) >= 0) d = 2;
      else { const giao = w.filter(t => x.w.indexOf(t) >= 0).length; d = giao / Math.max(1, Math.min(w.length, x.w.length)) - Math.abs(w.length - x.w.length) * 0.02; }
      if (d > diem) { diem = d; best = x.b; }
    });
    return { goc: goc, ten: ten, kl: kl, b: diem >= 0.6 ? best : null };
  });
}

/* ---------------- B3. In mã QR ---------------- */
function qrSVG_(text, px) {
  const m = KM0QR_(text, 'M'), n = m.length, q = 4, s = n + q * 2; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) d += 'M' + (c + q) + ' ' + (r + q) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + s + ' ' + s + '" width="' + px + '" height="' + px + '" shape-rendering="crispEdges" role="img" aria-label="Mã QR"><rect width="' + s + '" height="' + s + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

    '<p class="hint">Mỗi dòng 1 đoạn. Tổng dòng = Trái + Phải. Dán từ Excel: bấm vào 1 ô rồi Ctrl+V — các cột theo thứ tự như bảng. Có cột Bán kính → Excel xuất thêm bảng tổng theo bán kính (như mẫu "đoạn cong"). Mỗi vật tư có bảng thống kê = 1 sheet riêng, ô KL đề nghị ở sheet chính link tới ô tổng.</p>' +

    buttons: ro ? [{ text: 'Đóng' }] : [{ text: 'Huỷ' }, { text: 'Lưu bảng thống kê', icon: 'bi-check2', cls: 'primary', fn: (mm, b) => {
      $$('#tk-b input.nn-num', mm.el).forEach(el => nnTinhO_(el)); doc();
      const ds = rows.map(r => { const o2 = {}; COT.forEach(c => { o2[c[0]] = c[3] ? (String(r[c[0]] === undefined ? '' : r[c[0]]).trim() === '' ? '' : parseNum(r[c[0]])) : String(r[c[0]] || '').trim(); }); return o2; });
      withBusy(b, () => api('apiLuuTKViTri', x.MaDX, ds, $('#tk-sl', mm.el).checked)).then(k => { toast('Đã lưu ' + k.soDong + ' dòng, tổng ' + fmtNum(k.tong, 3) + ' ' + x.DonVi + '.', 'success'); mm.close();

function taiFileHoSo_(r, ctx) {

    '<div class="card"><div class="card-h">Hỏi đáp thiết kế (RFI)</div><div class="card-b flush">' + tb(['Ngày', 'Nội dung', 'Hạn xử lý', 'Trạng thái'], d.rfi.map(r => [esc(fmtDate(r.Ngay)), esc(r.MoTa), esc(fmtDate(r.HanXuLy)), badge(r.TrangThai)])) + '</div></div></div>' +
    '<div class="card mt-3"><div class="card-h">Nhật ký thi công</div><div class="card-b flush">' + tb(['Ngày', 'Thời tiết', 'Công việc'], d.nhatKy.map(r => [esc(fmtDate(r.Ngay)), esc(r.ThoiTiet), esc(r.CongViec)])) + '</div></div>';
}

/* ===== 99_init: khởi động ===== */
window.addEventListener('error', e => { try { if (e && e.message && !/ResizeObserver|Script error/i.test(e.message)) toast('Lỗi giao diện: ' + e.message, 'error', 8000); } catch (x) { /* bỏ qua */ } });
window.addEventListener('unhandledrejection', e => { try { const m = e && e.reason && e.reason.message ? e.reason.message : ''; if (m) console.error('Promise lỗi:', m); } catch (x) { /* bỏ qua */ } });
(function boot() {
  const start = () => resumeSession();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
